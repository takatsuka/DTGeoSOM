# Automatic releases (see RELEASING.md).
#
# On every push to main, if the version in src/mt/dtgeosom/__init__.py has no tag yet, this workflow
#   1. checks that CITATION.cff has the same version and CHANGELOG.md has a section for it,
#   2. builds the sdist and wheel and tests the wheel in a clean environment,
#   3. uploads them to PyPI (trusted publishing: no API token is stored anywhere),
#   4. tags the commit vX.Y.Z and creates a GitHub release with the CHANGELOG notes and the files.
# Pushes that do not change the version do nothing.  A manual run (Actions -> publish -> Run workflow)
# is a rehearsal: it builds, tests and uploads to TestPyPI only.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # all tags
      - id: v
        name: Is there a new version?
        run: |
          VERSION=$(python3 -c "import re,pathlib;print(re.search(r'__version__\s*=\s*[\x27\x22]([^\x27\x22]+)', pathlib.Path('src/mt/dtgeosom/__init__.py').read_text()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "new version $VERSION: releasing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version $VERSION (already tagged, or a manual rehearsal)"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check CITATION.cff and CHANGELOG.md
        run: |
          CFF=$(grep '^version:' CITATION.cff | awk '{print $2}')
          echo "package=$VERSION citation=$CFF"
          test "$VERSION" = "$CFF" || { echo "::error::CITATION.cff has version $CFF, the package $VERSION"; exit 1; }
          grep -q "^## $VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }

      - name: Point README links at GitHub (PyPI cannot follow relative paths)
        run: |
          REF="$GITHUB_SHA"           # the released commit (its tag is only created after the upload)
          sed -i -E "s#\]\((docs/images/[^)]+)\)#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/\1)#g" README.md
          sed -i -E "s#\]\(((docs|examples)/[^)]+\.md|LICENSE|NOTICE|CITATION\.cff|RELEASING\.md)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${REF}/\1)#g" README.md
          grep -n 'github' README.md

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Test the built wheel in a clean environment
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install "$(ls dist/*.whl)[interactive]" pytest
          cd /tmp && /tmp/wheeltest/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  pypi:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Tag and create the GitHub release
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "DTGeoSOM $VERSION" --notes-file notes.md

  testpypi:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

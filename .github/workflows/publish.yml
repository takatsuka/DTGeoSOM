# Publishes to PyPI when a GitHub release is published (see RELEASING.md).
#
# Create a release on GitHub (Releases -> Draft a new release) with a new tag vX.Y.Z and press "Publish
# release".  This workflow then
#   1. checks that the tag matches __version__ in src/mt/dtgeosom/__init__.py and the version in CITATION.cff,
#   2. builds the sdist and wheel and tests the wheel in a clean environment,
#   3. uploads them to PyPI (trusted publishing: no API token is stored anywhere).
# Pushing to main never publishes anything.  A manual run (Actions -> publish -> Run workflow) is a rehearsal:
# it builds, tests and uploads to TestPyPI only.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches __version__ and CITATION.cff
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*[\x27\x22]([^\x27\x22]+)', pathlib.Path('src/mt/dtgeosom/__init__.py').read_text()).group(1))")
          CFF=$(grep '^version:' CITATION.cff | awk '{print $2}')
          echo "tag=$TAG package=$PKG citation=$CFF"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG but __version__ is $PKG"; exit 1; }
          test "$TAG" = "$CFF" || { echo "::error::tag v$TAG but CITATION.cff has $CFF"; exit 1; }

      - name: Point README links at GitHub (PyPI cannot follow relative paths)
        run: |
          REF="$GITHUB_SHA"
          sed -i -E "s#\]\((docs/images/[^)]+)\)#](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF}/\1)#g" README.md
          sed -i -E "s#\]\(((docs|examples)/[^)]+\.md|LICENSE|NOTICE|CITATION\.cff|RELEASING\.md)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${REF}/\1)#g" README.md
          grep -n 'github' README.md

      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Test the built wheel in a clean environment
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install "$(ls dist/*.whl)[interactive]" pytest
          cd /tmp && /tmp/wheeltest/bin/python -m pytest "$GITHUB_WORKSPACE/tests" -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
